[package]
name = "slipstream-client-ffi"
version = "0.1.3"
edition = "2024"

[lib]
name = "slipstream_client_ffi"
crate-type = ["cdylib"]

[dependencies]
slipstream-client = { path = "../slipstream-client" }
slipstream-core = { path = "../slipstream-core" }
slipstream-ffi = { path = "../slipstream-ffi" }
tokio = { version = "1", features = ["rt", "sync"] }
libc = "0.2"

# Called from Go via cgo. Keep panic = "unwind" so a Rust panic
# doesn't abort the entire Go process.
[profile.release]
panic = "unwind"

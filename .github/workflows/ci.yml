name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  rust-format-check:
    name: Rust fmt
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out slipstream-rust
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Rust fmt
        run: cargo fmt --check

  rust-clippy:
    name: Rust clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out slipstream-rust
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libssl-dev python3

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
